[package]
name = "babm"
version = "0.1.0"
edition = "2024"
authors = ["Bunchy"]
description = "Bunchy's Automation BeamNG Management"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
eframe = "0.33"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
zip = { version = "2", default-features = false, features = ["deflate"] }
rfd = "0.15"
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
dirs = "6.0"
walkdir = "2.5"

[profile.release]
opt-level = 3
